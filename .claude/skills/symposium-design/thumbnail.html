<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .tile{display:flex;width:1280px;height:854px}
  .main{flex:1;background:var(--ink-0);display:flex;align-items:center;justify-content:center;position:relative;background-image:var(--texture-grain)}
  .main .word{font:var(--fw-regular) 168px/0.95 var(--font-display);color:var(--paper-0);letter-spacing:0.01em}
  .dot{width:26px;height:26px;border-radius:50%;background:var(--cinnabar-500);position:absolute;bottom:300px;left:calc(50% + 415px)}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><span class="word">Symposium</span></div>
  <div class="strip">
    <span style="background:#EEC5B8"></span>
    <span style="background:#C0442C"></span>
    <span style="background:#40507A"></span>
    <span style="background:#8F2E1E"></span>
  </div>
</div>
</body>
</html>
