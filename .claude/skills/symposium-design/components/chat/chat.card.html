<!-- @dsCard group="Components" viewport="700x560" name="Chat — Messages, Citations, Composer & states" subtitle="Conversation building blocks incl. both citation variants" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;background:var(--surface-page);padding:28px;font-family:var(--font-sans)}.lbl{font:600 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:26px 0 14px}.lbl:first-child{margin-top:0}.col{display:flex;flex-direction:column;gap:16px;max-width:640px}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { MessageBubble, CitationCard, TypingIndicator, Composer, SuggestedQuestion, DisclosureBanner } = window.SymposiumDesignSystem_32eaa4;
function Demo(){const[v,setV]=React.useState("");return(<div className="col">
  <div className="lbl">Message turns + citation tray</div>
  <MessageBubble role="user">What did you mean by “the obstacle is the way”?</MessageBubble>
  <MessageBubble role="assistant" author="Marcus Aurelius" accentColor="#40507A" defaultOpen
    citations={[{variant:"book",excerpt:"The impediment to action advances action. What stands in the way becomes the way.",source:"Meditations",detail:"Book V, 20"}]}>
    Consider that every obstacle carries within it the material for its own overcoming. The mind adapts what blocks it and turns it toward its purpose.
  </MessageBubble>
  <div className="lbl">CitationCard — book vs. video</div>
  <CitationCard variant="book" index={1} excerpt="You have power over your mind — not outside events. Realize this, and you will find strength." source="Meditations" detail="Book IV, 3"/>
  <CitationCard variant="video" index={2} excerpt="The universe is not obligated to make sense to you." videoTitle="Why Is The Universe Flat?" timestamp="12:34" channelColor="#2A6DF4" />
  <div className="lbl">Thinking state</div>
  <TypingIndicator author="Churchill" accentColor="#7A5230" label="is searching his speeches"/>
  <div className="lbl">Streaming</div>
  <MessageBubble role="assistant" author="Einstein" accentColor="#3B6E7A" streaming>Imagination is more important than knowledge, for knowledge is limited</MessageBubble>
  <div className="lbl">Suggested question</div>
  <SuggestedQuestion accentColor="#40507A">How should I respond when I cannot control what happens to me?</SuggestedQuestion>
  <div className="lbl">Composer</div>
  <Composer value={v} onChange={setV} figureName="Marcus Aurelius"/>
  <div className="lbl">Disclosure</div>
  <DisclosureBanner figureName="Marcus Aurelius"/>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
