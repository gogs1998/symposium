<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;background:var(--surface-page);padding:28px;font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:22px}.lbl{font:600 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);width:100%;margin-bottom:2px}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Badge, Tag } = window.SymposiumDesignSystem_32eaa4;
function Demo(){return(<>
  <div className="row"><span className="lbl">Button — variants</span>
    <Button variant="primary">Begin conversation</Button>
    <Button variant="secondary">Back to roster</Button>
    <Button variant="ghost">Share</Button>
    <Button variant="quiet">Cancel</Button>
    <Button variant="primary" disabled>Disabled</Button>
  </div>
  <div className="row"><span className="lbl">Sizes · with glyph</span>
    <Button size="sm">Small</Button>
    <Button size="md" iconTrailing={<span>→</span>}>Medium</Button>
    <Button size="lg" variant="secondary">Large</Button>
  </div>
  <div className="row"><span className="lbl">IconButton</span>
    <IconButton label="Send" variant="solid">↑</IconButton>
    <IconButton label="Attach" variant="outline">＋</IconButton>
    <IconButton label="More" variant="ghost">⋯</IconButton>
  </div>
  <div className="row"><span className="lbl">Badge · Tag</span>
    <Badge tone="live" dot>Published</Badge>
    <Badge tone="pending" dot>Coming soon</Badge>
    <Badge tone="accent">New</Badge>
    <Tag kind="era">Stoic · 121 AD</Tag>
    <Tag kind="channel" accentColor="#2A6DF4">Science &amp; Education</Tag>
  </div>
</>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
