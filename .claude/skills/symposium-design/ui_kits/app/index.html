<!doctype html><html><head><meta charset="utf-8"><title>Symposium — app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="RosterScreen.jsx"></script>
<script type="text/babel" src="FigureIntroScreen.jsx"></script>
<script type="text/babel" src="ChatScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState({ screen: 'roster' });
  const figures = window.SYM_DATA.figures;
  if (route.screen === 'intro') return <window.FigureIntroScreen figure={route.figure}
    onBack={() => setRoute({ screen: 'roster' })}
    onBegin={() => setRoute({ screen: 'chat', figure: route.figure })}
    onOpenWith={q => setRoute({ screen: 'chat', figure: route.figure, q })} />;
  if (route.screen === 'chat') return <window.ChatScreen figure={route.figure} initialQuestion={route.q} onBack={() => setRoute({ screen: 'roster' })} />;
  return <window.RosterScreen figures={figures} onOpen={f => setRoute({ screen: 'intro', figure: f })} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
