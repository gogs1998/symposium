<!-- @dsCard group="Colors" viewport="700x150" name="Ink — warm text & lines" subtitle="Near-black to hairline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:22px 26px}.r{display:flex;gap:12px}.sw{flex:1;height:82px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px}.n{font:500 11px/1.3 var(--font-mono)}</style>
</head><body><div class="r">
<div class="sw" style="background:var(--ink-0)"><span class="n" style="color:#F3ECDD">ink-0</span></div>
<div class="sw" style="background:var(--ink-1)"><span class="n" style="color:#F3ECDD">ink-1</span></div>
<div class="sw" style="background:var(--ink-2)"><span class="n" style="color:#F3ECDD">ink-2</span></div>
<div class="sw" style="background:var(--ink-3)"><span class="n" style="color:#1C1813">ink-3</span></div>
<div class="sw" style="background:var(--ink-4);border:1px solid var(--border-line)"><span class="n" style="color:#1C1813">ink-4</span></div>
</div></body></html>
