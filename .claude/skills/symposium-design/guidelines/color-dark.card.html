<!-- @dsCard group="Colors" viewport="700x170" name="Dark mode — warm ink" subtitle="[data-theme=dark] surfaces & accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>.wrap{background:var(--surface-page);padding:22px 26px}.r{display:flex;gap:12px}.sw{flex:1;height:78px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;border:1px solid var(--border-line)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}body{margin:0}</style>
</head><body data-theme="dark"><div class="wrap">
<div class="r">
<div class="sw" style="background:var(--paper-0)"><span class="n">paper-0</span></div>
<div class="sw" style="background:var(--paper-1)"><span class="n">paper-1</span></div>
<div class="sw" style="background:var(--paper-3)"><span class="n">paper-3</span></div>
<div class="sw" style="background:var(--accent)"><span class="n" style="color:#1B0E0A">accent</span></div>
<div class="sw" style="background:var(--surface-page);color:var(--text-strong);align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px">Aa</div>
</div>
</div></body></html>
