<!-- @dsCard group="Spacing" viewport="700x180" name="Radii, shadows & rule" subtitle="Sharp corners, warm low shadows, editorial rule" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:24px 26px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.card{width:96px;height:70px;background:var(--surface-card);border:1px solid var(--border-line);display:flex;align-items:flex-end;padding:7px}.n{font:400 11px/1.2 var(--font-mono);color:var(--text-muted)}.rule{width:100%;border-top:2px solid var(--rule-ink);height:0}</style>
</head><body>
<div class="card" style="border-radius:var(--radius-sm)"><span class="n">radius-sm 4</span></div>
<div class="card" style="border-radius:var(--radius-md)"><span class="n">radius-md 6</span></div>
<div class="card" style="border-radius:var(--radius-lg)"><span class="n">radius-lg 10</span></div>
<div class="card" style="border:none;box-shadow:var(--shadow-sm)"><span class="n">shadow-sm</span></div>
<div class="card" style="border:none;box-shadow:var(--shadow-md)"><span class="n">shadow-md</span></div>
<div class="card" style="border:none;box-shadow:var(--shadow-lg)"><span class="n">shadow-lg</span></div>
</body></html>
