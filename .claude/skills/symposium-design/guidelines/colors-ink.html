<!-- @dsCard group="Colors" viewport="700x160" name="Ink" subtitle="Deep aegean blue-black text ramp" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:16px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
<div><div style="height:72px;background:var(--ink-1);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--ink-1<br>#1c2b3a body</div></div>
<div><div style="height:72px;background:var(--ink-2);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--ink-2<br>#47586a secondary</div></div>
<div><div style="height:72px;background:var(--ink-3);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--ink-3<br>#75828f muted</div></div>
<div><div style="height:72px;background:var(--ink-1);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--ink-inverse);font-family:var(--font-display);letter-spacing:.06em">INVERSE</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--ink-inverse<br>#f7f5f0 on ink</div></div>
</div>
</body></html>
