<!-- @dsCard group="Spacing" viewport="700x170" name="Radii, borders, shadows" subtitle="2px controls · 4px cards · double rule · two shadows" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:20px 24px">
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="text-align:center"><div style="width:110px;height:64px;background:var(--surface-card);border:var(--border-hairline);border-radius:var(--radius-1)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">radius-1 · 2px</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;background:var(--surface-card);border:var(--border-hairline);border-radius:var(--radius-2);box-shadow:var(--shadow-1)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">radius-2 + shadow-1</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;background:var(--surface-card);border:var(--border-plaque);border-radius:var(--radius-2);box-shadow:var(--shadow-overlay)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">overlay shadow</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;display:flex;align-items:center"><div style="width:100%;border-bottom:var(--rule-double)"></div></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">double rule</div></div>
</div>
</body></html>
