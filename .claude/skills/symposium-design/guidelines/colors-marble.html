<!-- @dsCard group="Colors" viewport="700x160" name="Marble surfaces" subtitle="Warm stone neutrals — page, panels, cards" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:16px">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
<div><div style="height:72px;background:var(--marble-0);border:var(--border-hairline);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--marble-0<br>#f7f5f0 page</div></div>
<div><div style="height:72px;background:var(--marble-1);border:var(--border-hairline);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--marble-1<br>#efece4 raised</div></div>
<div><div style="height:72px;background:var(--marble-2);border:var(--border-hairline);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--marble-2<br>#e6e2d6 inset</div></div>
<div><div style="height:72px;background:var(--marble-card);border:var(--border-hairline);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--marble-card<br>#fdfcf9 card</div></div>
<div><div style="height:72px;background:var(--stone-line);border:1px solid var(--stone-line-strong);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--stone-line<br>#dcd6c8 border</div></div>
</div>
</body></html>
