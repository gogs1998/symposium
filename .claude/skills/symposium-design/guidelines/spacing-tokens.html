<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:20px 24px">
<div style="display:flex;align-items:flex-end;gap:16px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">1·4</div></div>
<div style="text-align:center"><div style="width:8px;height:8px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">2·8</div></div>
<div style="text-align:center"><div style="width:12px;height:12px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">3·12</div></div>
<div style="text-align:center"><div style="width:16px;height:16px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">4·16</div></div>
<div style="text-align:center"><div style="width:24px;height:24px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">5·24</div></div>
<div style="text-align:center"><div style="width:32px;height:32px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">6·32</div></div>
<div style="text-align:center"><div style="width:48px;height:48px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">7·48</div></div>
<div style="text-align:center"><div style="width:64px;height:64px;background:var(--lapis);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px">8·64</div></div>
</div>
</body></html>
